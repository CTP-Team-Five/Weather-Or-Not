<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>WeatherOrNot — Discovery Popup redesign</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

<style>
  :root {
    --font-body: 'Barlow', system-ui, -apple-system, sans-serif;
    --font-display: 'Barlow Condensed', 'Barlow', system-ui, sans-serif;
    --font-editorial: 'Instrument Serif', Georgia, serif;

    --ink:        #0f172a;
    --ink-soft:   #334155;
    --muted:      #64748b;
    --muted-2:    #94a3b8;
    --line:       rgba(15,23,42,0.08);
    --line-soft:  rgba(15,23,42,0.05);
    --bg:         #ffffff;
    --bg-soft:    #f8fafc;

    --hike: #16a34a;
    --surf: #0891b2;
    --snowboard: #2563eb;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: #eef2f3;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ──────────────────────────────────────────────────────────────────
     APP CHROME (topbar borrowed from the existing prototype)
     ────────────────────────────────────────────────────────────────── */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 1000;
    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border-bottom: 1px solid var(--line);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 0 20px;
    font-family: var(--font-display);
  }
  .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; }
  .brand-dot { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fde68a 0%, #fbbf24 55%, #f59e0b 100%); box-shadow: 0 0 0 3px rgba(251,191,36,0.18); }
  .brand .b-accent { color: #f59e0b; }
  .nav { display: inline-flex; gap: 2px; justify-self: center; }
  .nav a { position: relative; padding: 8px 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
  .nav a[aria-current="page"] { color: var(--ink); }
  .nav a[aria-current="page"]::after { content: ""; position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); width: 18px; height: 2px; background: var(--ink); border-radius: 2px; }
  .right { display: inline-flex; align-items: center; gap: 10px; justify-self: end; font-family: var(--font-body); white-space: nowrap; }
  .sign-in { font-size: 13px; font-weight: 500; color: var(--ink); text-decoration: none; white-space: nowrap; }
  .new-spot { background: var(--ink); color: #fff; padding: 7px 12px; font-size: 12px; font-weight: 600; border-radius: 7px; text-decoration: none; white-space: nowrap; }

  /* ──────────────────────────────────────────────────────────────────
     MAP
     ────────────────────────────────────────────────────────────────── */
  #map { position: fixed; top: 56px; bottom: 0; left: 0; right: 0; z-index: 0; background: #eef2f3; }

  /* ──────────────────────────────────────────────────────────────────
     VARIANT SWITCHER (top-center floating)
     ────────────────────────────────────────────────────────────────── */
  .variant-bar {
    position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
    z-index: 900;
    display: flex; align-items: center; gap: 10px;
    padding: 6px;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 12px 32px -10px rgba(15,23,42,0.18);
  }
  .variant-bar .vb-label {
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 8px 0 6px;
  }
  .variant-bar .v-seg { display: inline-flex; gap: 2px; background: rgba(15,23,42,0.05); padding: 3px; border-radius: 9px; }
  .variant-bar .v-btn {
    appearance: none; border: 0; background: transparent;
    font-family: var(--font-body);
    font-size: 12.5px; font-weight: 600;
    color: var(--ink-soft);
    padding: 6px 12px; border-radius: 7px;
    cursor: pointer;
    transition: background 140ms ease, color 140ms ease;
    line-height: 1;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .v-btn:hover { color: var(--ink); }
  .v-btn { white-space: nowrap; }
  .v-btn[aria-pressed="true"] {
    background: #ffffff;
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(15,23,42,0.06), 0 4px 10px -4px rgba(15,23,42,0.12);
  }
  .v-btn .v-key {
    font-family: var(--font-display);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.12em;
    color: var(--muted);
  }
  .v-btn[aria-pressed="true"] .v-key { color: #f59e0b; }

  /* ──────────────────────────────────────────────────────────────────
     DISCOVER PANEL (refined)
     ────────────────────────────────────────────────────────────────── */
  .discover {
    position: fixed; right: 16px; bottom: 16px; z-index: 800;
    width: 296px;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 16px 40px -12px rgba(15,23,42,0.22);
    padding: 14px 14px 12px;
    font-family: var(--font-body);
  }
  .discover-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .d-eye { font-family: var(--font-display); font-size: 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .d-title { margin-top: 2px; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); line-height: 1.2; }
  .d-sub { margin-top: 1px; font-size: 11.5px; color: var(--muted); }
  .d-close { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border-radius: 7px; background: rgba(15,23,42,0.04); border: 0; color: var(--muted); cursor: pointer; flex-shrink: 0; }
  .d-close:hover { background: rgba(15,23,42,0.08); color: var(--ink); }

  .d-segment { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; padding: 3px; background: rgba(15,23,42,0.04); border: 1px solid var(--line-soft); border-radius: 999px; }
  .d-chip {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 8px;
    border: 0; border-radius: 999px;
    background: transparent;
    font-family: var(--font-body);
    font-size: 12px; font-weight: 600; line-height: 1;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 140ms ease, color 140ms ease, transform 140ms ease;
  }
  .d-chip svg { width: 14px; height: 14px; }
  .d-chip[aria-pressed="true"][data-activity="hike"]      { background: var(--hike); color: #fff; }
  .d-chip[aria-pressed="true"][data-activity="surf"]      { background: var(--surf); color: #fff; }
  .d-chip[aria-pressed="true"][data-activity="snowboard"] { background: var(--snowboard); color: #fff; }
  .d-chip:not([aria-pressed="true"]):hover { background: rgba(15,23,42,0.04); color: var(--ink); }

  .d-status {
    margin-top: 10px;
    font-size: 11.5px;
    color: var(--muted);
    display: flex; align-items: center; gap: 8px;
    line-height: 1.4;
  }
  .d-pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--hike); box-shadow: 0 0 0 0 currentColor; animation: pulseDot 1.6s ease-out infinite; color: var(--hike); }
  @keyframes pulseDot { 0% { box-shadow: 0 0 0 0 currentColor; opacity: 0.7; } 70% { box-shadow: 0 0 0 6px rgba(22,163,74,0); opacity: 1; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .d-divider { width: 3px; height: 3px; border-radius: 50%; background: var(--muted-2); }

  /* ──────────────────────────────────────────────────────────────────
     DISCOVERY TEARDROP MARKER (dashed outline, white)
     ────────────────────────────────────────────────────────────────── */
  .wo-discovery-marker { background: none !important; border: 0 !important; }
  .wo-discovery-marker svg { transition: transform 180ms ease; }
  .wo-discovery-marker:hover svg { transform: scale(1.10) translateY(-2px); }

  /* ──────────────────────────────────────────────────────────────────
     LEAFLET POPUP — strip native chrome, our card draws everything
     ────────────────────────────────────────────────────────────────── */
  .wo-discovery-popup .leaflet-popup-content-wrapper {
    padding: 0;
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 18px 48px -12px rgba(15,23,42,0.30), 0 4px 12px -4px rgba(15,23,42,0.12);
  }
  .wo-discovery-popup .leaflet-popup-content {
    margin: 0;
    width: 280px !important;
    font-family: var(--font-body);
  }
  .wo-discovery-popup .leaflet-popup-tip {
    box-shadow: 0 6px 16px -4px rgba(15,23,42,0.18);
  }
  .wo-discovery-popup .leaflet-popup-close-button {
    color: rgba(255,255,255,0.92) !important;
    font-size: 18px !important;
    padding: 6px 8px !important;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    z-index: 2;
  }
  .wo-discovery-popup.v-a .leaflet-popup-close-button,
  .wo-discovery-popup.v-c .leaflet-popup-close-button,
  .wo-discovery-popup.v-d .leaflet-popup-close-button {
    color: rgba(15,23,42,0.55) !important;
    text-shadow: none;
  }

  /* ──────────────────────────────────────────────────────────────────
     SHARED POPUP PARTS
     ────────────────────────────────────────────────────────────────── */
  .pop { font-family: var(--font-body); color: var(--ink); background: #fff; }

  /* Activity capsule */
  .pop-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 9px 4px 8px;
    font-family: var(--font-display);
    font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    border-radius: 999px;
    background: rgba(255,255,255,0.95);
    color: var(--ink);
    box-shadow: 0 2px 8px -2px rgba(15,23,42,0.22);
  }
  .pop-chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .pop-chip.hike .dot { background: var(--hike); }
  .pop-chip.surf .dot { background: var(--surf); }
  .pop-chip.snowboard .dot { background: var(--snowboard); }

  /* Meta row (distance · type · extras) */
  .pop-meta {
    font-family: var(--font-display);
    font-size: 11.5px; font-weight: 600;
    letter-spacing: 0.10em; text-transform: uppercase;
    color: var(--muted);
    display: inline-flex; align-items: center; gap: 8px;
    flex-wrap: wrap;
  }
  .pop-meta .sep { color: var(--muted-2); }

  /* Save button (shared across variants — solid, full-width, activity color) */
  .pop-cta {
    appearance: none; border: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--ink);
    color: #fff;
    font-family: var(--font-body);
    font-size: 13px; font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1;
    transition: transform 90ms ease, filter 140ms ease, background 140ms ease;
  }
  .pop-cta:hover { filter: brightness(1.08); }
  .pop-cta:active { transform: translateY(1px); }
  .pop-cta[data-activity="hike"]      { background: var(--hike); }
  .pop-cta[data-activity="surf"]      { background: var(--surf); }
  .pop-cta[data-activity="snowboard"] { background: var(--snowboard); }
  .pop-cta.is-saved { background: #0f172a; }
  .pop-cta svg { width: 14px; height: 14px; }

  /* Attribution line — integrated, low-key */
  .pop-attr {
    display: flex; align-items: center; gap: 8px;
    font-size: 10.5px;
    color: var(--muted-2);
    letter-spacing: 0.02em;
  }
  .pop-attr a { color: inherit; text-decoration: none; }
  .pop-attr a:hover { color: var(--ink); }
  .pop-attr .sep { color: rgba(148,163,184,0.5); }
  .pop-attr .grow { flex: 1; }

  /* Hero photo (shared) */
  .pop-hero { position: relative; width: 100%; overflow: hidden; background: #f1f5f9; }
  .pop-hero img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 280ms ease; }
  .pop-hero img.loaded { opacity: 1; }

  /* Hero shimmer */
  .pop-hero.skeleton {
    background: linear-gradient(120deg, #f1f5f9 0%, #e2e8f0 50%, #f1f5f9 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* Map snippet for no-photo state */
  .map-snippet {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #e7eef1;
  }
  .map-snippet .tiles {
    position: absolute; left: 0; top: 0;
    width: 768px; height: 768px;
    display: grid; grid-template-columns: repeat(3, 256px); grid-template-rows: repeat(3, 256px);
    image-rendering: -webkit-optimize-contrast;
  }
  .map-snippet .tiles img { display: block; width: 256px; height: 256px; user-select: none; -webkit-user-drag: none; }
  .map-snippet .center-pin {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -100%);
    pointer-events: none;
  }
  .map-snippet .center-pin svg { display: block; filter: drop-shadow(0 3px 6px rgba(15,23,42,0.25)); }
  .map-snippet .tint {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 70%, rgba(255,255,255,0.4) 100%);
    pointer-events: none;
  }

  /* ──────────────────────────────────────────────────────────────────
     VARIANT A — refined baseline
     Photo above, info below. Tighter type, clearer hierarchy.
     ────────────────────────────────────────────────────────────────── */
  .v-a .pop-hero { aspect-ratio: 5 / 3; }
  .v-a .pop-hero .chip-mount {
    position: absolute; top: 10px; left: 10px;
  }
  .v-a .pop-body { padding: 14px 16px 14px; }
  .v-a .pop-name {
    font-size: 17px; font-weight: 700; letter-spacing: -0.012em;
    line-height: 1.18; color: var(--ink);
  }
  .v-a .pop-meta { margin-top: 6px; }
  .v-a .pop-summary {
    margin: 10px 0 0;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink-soft);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .v-a .pop-cta-wrap { margin-top: 14px; }
  .v-a .pop-foot { margin-top: 10px; }

  /* ──────────────────────────────────────────────────────────────────
     VARIANT B — name overlaid on photo (cinematic-lite)
     ────────────────────────────────────────────────────────────────── */
  .v-b .pop-hero { aspect-ratio: 5 / 3.2; }
  .v-b .pop-hero .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(15,23,42,0) 30%, rgba(15,23,42,0.05) 50%, rgba(15,23,42,0.62) 100%);
    pointer-events: none;
  }
  .v-b .pop-hero .chip-mount {
    position: absolute; top: 10px; left: 10px;
  }
  .v-b .pop-hero .overlay-name {
    position: absolute; left: 14px; right: 14px; bottom: 11px;
    color: #fff;
  }
  .v-b .overlay-name .name {
    font-size: 18px; font-weight: 700; letter-spacing: -0.012em; line-height: 1.15;
    text-shadow: 0 1px 8px rgba(0,0,0,0.35);
  }
  .v-b .overlay-name .meta {
    margin-top: 4px;
    font-family: var(--font-display);
    font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(255,255,255,0.9);
    display: inline-flex; gap: 8px; align-items: center;
  }
  .v-b .overlay-name .meta .sep { color: rgba(255,255,255,0.55); }
  .v-b .pop-body { padding: 12px 16px 14px; }
  .v-b .pop-summary {
    margin: 0;
    font-size: 12.5px; line-height: 1.5; color: var(--ink-soft);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .v-b .pop-cta-wrap { margin-top: 12px; }
  .v-b .pop-foot { margin-top: 10px; }
  /* When no photo + no summary, the gap collapses */
  .v-b .pop-body:has(.pop-summary:empty) { padding-top: 6px; }

  /* ──────────────────────────────────────────────────────────────────
     VARIANT C — compact (Google-Maps-like denser card)
     Side-by-side hero (small square) + info column. No summary.
     ────────────────────────────────────────────────────────────────── */
  .v-c .pop-row {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 0;
  }
  .v-c .pop-hero { aspect-ratio: 1; height: 96px; }
  .v-c .pop-side { padding: 12px 14px 12px 12px; min-width: 0; }
  .v-c .chip-mount-inline { margin-bottom: 4px; }
  .v-c .pop-chip { font-size: 9.5px; padding: 3px 8px 3px 7px; letter-spacing: 0.14em; box-shadow: none; background: rgba(15,23,42,0.04); }
  .v-c .pop-name {
    font-size: 15px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; color: var(--ink);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .v-c .pop-meta { margin-top: 4px; font-size: 11px; }
  .v-c .pop-foot-row { padding: 10px 14px 12px; border-top: 1px solid var(--line-soft); display: flex; align-items: center; gap: 10px; }
  .v-c .pop-cta { padding: 9px 12px; font-size: 12px; flex: 1; min-width: 0; }
  .v-c .pop-attr { padding: 0 14px 10px; }

  /* ──────────────────────────────────────────────────────────────────
     VARIANT D — editorial
     Instrument Serif italic accent on the activity word, condensed name.
     Tag chips row when extras exist.
     ────────────────────────────────────────────────────────────────── */
  .v-d .pop-hero { aspect-ratio: 5 / 3; }
  .v-d .pop-hero .chip-mount { display: none; }
  .v-d .pop-body { padding: 13px 16px 14px; }
  .v-d .pop-kicker {
    font-family: var(--font-display);
    font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.20em; text-transform: uppercase;
    color: var(--muted);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .v-d .pop-kicker .swatch { width: 8px; height: 8px; border-radius: 50%; }
  .v-d .pop-kicker .swatch.hike { background: var(--hike); }
  .v-d .pop-kicker .swatch.surf { background: var(--surf); }
  .v-d .pop-kicker .swatch.snowboard { background: var(--snowboard); }
  .v-d .pop-kicker em {
    font-family: var(--font-editorial);
    font-style: italic;
    font-weight: 400;
    font-size: 13.5px;
    letter-spacing: 0;
    text-transform: none;
    margin-left: 2px;
  }
  .v-d .pop-kicker.hike em { color: var(--hike); }
  .v-d .pop-kicker.surf em { color: var(--surf); }
  .v-d .pop-kicker.snowboard em { color: var(--snowboard); }
  .v-d .pop-name {
    margin-top: 4px;
    font-family: var(--font-display);
    font-size: 22px; font-weight: 700; letter-spacing: -0.005em; line-height: 1.05;
    color: var(--ink);
  }
  .v-d .pop-tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px; }
  .v-d .tag {
    display: inline-flex; align-items: baseline; gap: 5px;
    padding: 4px 8px;
    border-radius: 6px;
    background: var(--bg-soft);
    border: 1px solid var(--line-soft);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
  }
  .v-d .tag .k { color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.10em; font-size: 9.5px; }
  .v-d .pop-summary {
    margin: 10px 0 0;
    font-size: 12.5px; line-height: 1.5; color: var(--ink-soft);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .v-d .pop-cta-wrap { margin-top: 14px; }
  .v-d .pop-foot { margin-top: 10px; }

  /* ──────────────────────────────────────────────────────────────────
     LEAFLET CONTROL OVERRIDES
     ────────────────────────────────────────────────────────────────── */
  .leaflet-control-zoom { border: 0 !important; box-shadow: 0 4px 12px -4px rgba(15,23,42,0.18) !important; border-radius: 10px !important; overflow: hidden; }
  .leaflet-control-zoom a { background: rgba(255,255,255,0.95) !important; color: var(--ink) !important; font-weight: 600; border: 0 !important; }
  .leaflet-control-zoom a:hover { background: #fff !important; }
  .leaflet-control-attribution { background: rgba(255,255,255,0.85) !important; font-size: 10px !important; }
</style>
</head>
<body>

<header class="topbar" role="banner">
  <a class="brand" href="#">
    <span class="brand-dot" aria-hidden="true"></span>
    Weather<span class="b-accent">OrNot</span>
  </a>
  <nav class="nav" aria-label="Primary">
    <a href="#">Pins</a>
    <a href="#" aria-current="page">Map</a>
    <a href="#">Forecast</a>
  </nav>
  <div class="right">
    <a class="sign-in" href="#">Sign in</a>
    <a class="new-spot" href="#">+ New Spot</a>
  </div>
</header>

<div id="map" role="application" aria-label="Discovery map"></div>

<div class="variant-bar" role="toolbar" aria-label="Popup variant">
  <span class="vb-label">Popup style</span>
  <div class="v-seg" id="vSeg">
    <button class="v-btn" type="button" data-variant="a" aria-pressed="false"><span class="v-key">A</span> Refined</button>
    <button class="v-btn" type="button" data-variant="b" aria-pressed="true"><span class="v-key">B</span> Name overlay</button>
    <button class="v-btn" type="button" data-variant="c" aria-pressed="false"><span class="v-key">C</span> Compact</button>
    <button class="v-btn" type="button" data-variant="d" aria-pressed="false"><span class="v-key">D</span> Editorial</button>
  </div>
</div>

<aside class="discover" id="discover" role="region" aria-label="Discover">
  <div class="discover-head">
    <div>
      <div class="d-eye">Discover</div>
      <div class="d-title">Find new spots</div>
      <div class="d-sub">Nearby places to hike, surf, or ride.</div>
    </div>
    <button class="d-close" type="button" aria-label="Close discover panel">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3 L11 11 M11 3 L3 11"/></svg>
    </button>
  </div>

  <div class="d-segment" role="radiogroup" aria-label="Activity">
    <button class="d-chip" type="button" data-activity="hike" aria-pressed="true" role="radio" aria-checked="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l5-8 4 4 5-9 4 13"/></svg>
      Hike
    </button>
    <button class="d-chip" type="button" data-activity="surf" aria-pressed="false" role="radio" aria-checked="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16c3 0 3-3 6-3s3 3 6 3 3-3 6-3"/><path d="M2 20c3 0 3-2 6-2s3 2 6 2 3-2 6-2"/></svg>
      Surf
    </button>
    <button class="d-chip" type="button" data-activity="snowboard" aria-pressed="false" role="radio" aria-checked="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l18-18M5 5l3 3M8 5l-3 3M19 19l-3-3M16 19l3-3M3 12h2M19 12h2M12 3v2M12 19v2"/></svg>
      Snow
    </button>
  </div>

  <div class="d-status">
    <span class="d-pulse" aria-hidden="true"></span>
    <span id="dCount">8 spots</span>
    <span class="d-divider" aria-hidden="true"></span>
    <span>within 40 km</span>
    <span class="d-divider" aria-hidden="true"></span>
    <span>approximate location</span>
  </div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="discovery-popups.js"></script>
<script src="discovery-app.js"></script>

</body>
</html>
